# XDK 4432 library data layouts the runtime reads or writes. Each value is proven by Buffy's Default.xbe at the address
# given, read through tools/disasm.py with the names from final.map.
[layout]
# D3D8 CDevice, the static device D3D::g_pDevice points at; its miniport is at +0x227C (D3DDevice_SetGammaRamp 0x5926E5)
CDevice_Push              = 0x0    # D3DDevice_SetPalette 0x593723 reads it, compares with +4, calls MakeSpace
CDevice_PushThreshold     = 0x4    # D3DDevice_SetTexture 0x593594 compares the push pointer with it
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x59671B ors BehaviorFlags & 0x10 into it
CDevice_BaseVertex        = 0x1C   # D3DDevice_SetIndices 0x5937A9 stores BaseVertexIndex
CDevice_Time              = 0x30   # D3D::SetFence 0x596DCD reads it, D3DDevice_SetTexture 0x593563 stamps resources with it
CDevice_PixelShader       = 0x370  # D3DDevice_SetPixelShader 0x59C674 stores the handle
CDevice_VertexShader      = 0x380  # D3D::CDevice::Init 0x598968 stores g_FvfVertexShader, D3DDevice_SetVertexShader 0x594C88 the current one
CDevice_IndexBuffer       = 0x38C  # D3DDevice_SetIndices 0x59377A reads the old one, 0x5937A2 stores the new one
CDevice_ZScale            = 0x450  # D3DDevice_GetViewportOffsetAndScale 0x591585 scales the Z range by it
CDevice_SuperSampleX      = 0x458  # D3DDevice_GetViewportOffsetAndScale 0x5914DE scales viewport X by it
CDevice_SuperSampleY      = 0x45C  # D3DDevice_GetViewportOffsetAndScale 0x591500 scales viewport Y by it
CDevice_BackBufferScale   = 0x468  # D3D::CDevice::InitializeFrameBuffers 0x59809B stores the X scale, 0x5980B4 the Y scale at +4
CDevice_Transforms        = 0x750  # D3DDevice_SetTransform 0x5927F6 copies 16 dwords to +0x750 + type * 64
CDevice_Viewport          = 0x9D0  # D3DDevice_SetViewport 0x5934DB to 0x5934FF stores X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0x9E8  # D3DDevice_SetScreenSpaceOffset 0x593C23 stores x + offset, 0x593C33 y + offset at +4
CDevice_Textures          = 0xA78  # D3DDevice_SetTexture 0x593550 reads, 0x593589 stores [stage]
CDevice_Palettes          = 0xA88  # D3DDevice_SetPalette 0x5936CD reads, 0x593705 stores [stage]
CDevice_RenderTarget      = 0x2070 # D3DDevice_GetRenderTarget 0x5933C5 returns it, D3DDevice_SetRenderTarget 0x592D90 stores it
CDevice_Depth             = 0x2074 # D3DDevice_SetRenderTarget 0x592DB9 stores the depth surface
CDevice_BackBuffer        = 0x207C # D3D::CDevice::InitializeFrameBuffers 0x598108 and 0x598251 make the first buffer here
CDevice_FrontBuffer       = 0x2080 # D3D::CDevice::InitializeFrameBuffers 0x598359 makes the second buffer here
CDevice_AutoDepth         = 0x2088 # D3D::CDevice::InitializeFrameBuffers 0x598432 stores the depth surface it made
CDevice_VBlankCallback    = 0x2444 # miniport + 0x1C8: D3D::CMiniport::VBlank 0x599C5E reads it
CDevice_VBlankEvent       = 0x2448 # miniport + 0x1CC: D3DDevice_BlockUntilVerticalBlank 0x592947 waits on it, 0x59293B clears its SignalState
CDevice_DisplayFlags      = 0x2468 # miniport + 0x1EC: D3D::CMiniport::VBlank 0x599BF2 tests it
CDevice_VBlankCount       = 0x2474 # miniport + 0x1F8: D3D::CMiniport::VBlank 0x599B74 to 0x599B9F increments it
CDevice_Field             = 0x2488 # miniport + 0x20C: D3D::CMiniport::VBlank 0x599C19 stores the field
CDevice_GammaRamps        = 0x2498 # miniport + 0x21C: D3DDevice_SetGammaRamp 0x592700 copies to it + index * 0x300
CDevice_GammaPending      = 0x2A98 # miniport + 0x81C: D3DDevice_SetGammaRamp 0x59272E sets [it + index * 4]
CDevice_SwapCount         = 0x2AD8 # D3DDevice_Swap 0x595DF6 increments it, 0x595E56 returns it
CDevice_Size              = 0x2B00 # Direct3D_CreateDevice 0x596761 clears 0xAC0 dwords of the device on failure
# D3D8 globals
DirtyFlags_Texture        = 0x4800 # D3DDevice_SetTexture 0x5935C5 ors it into D3D__DirtyFlags
TextureState_Stage        = 32     # D3DDevice_SetTextureStageStateNotInline 0x591EBB: [stage * 32 + type] dwords
Stream_Size               = 12     # D3DDevice_SetStreamSource 0x59487A indexes the stream table by n * 12
Stream_Stride             = 0x0    # D3DDevice_SetStreamSource 0x5948C2 stores Stride
Stream_Buffer             = 0x8    # D3DDevice_SetStreamSource 0x5948C8 stores the vertex buffer
PixelShader_Definition    = 0x8    # D3DDevice_SetPixelShader 0x59C6EB reads the definition pointer
# DSOUND
CDirectSoundStream_Vtable  = 0x0   # CDirectSoundStream constructor 0x5A8641 stores the IDirectSoundStream vtable
CDirectSoundStream_Vtable2 = 0x4   # CDirectSoundStream constructor 0x5A863A stores the CDirectSoundVoice vtable
EffectsImage_Skip0         = 0x804 # CMcpxGPDspManager::ParseEffectImageInfo 0x5A9A55 adds this dword count
EffectsImage_Skip1         = 0x80C # CMcpxGPDspManager::ParseEffectImageInfo 0x5A9A4F loads this dword count
EffectsImage_Desc          = 0x818 # CMcpxGPDspManager::ParseEffectImageInfo 0x5A9A5E: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current               = 0x0    # XGetDevices 0x6106C6 returns it
XPP_Changed               = 0x4    # XGetDevices 0x6106C8 clears it, XGetDeviceChanges 0x6106E6 tests it
XPP_Previous              = 0x8    # XGetDevices 0x6106CE copies Current into it
